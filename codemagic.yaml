# Builds the iPhone app in the cloud (no Mac needed) and sends it to TestFlight.
# One-time setup in Codemagic (codemagic.io, free tier ~500 build-min/month):
#   1. Add this repository (or upload the project folder).
#   2. Teams -> Integrations -> App Store Connect: add an API key from
#      App Store Connect (Users and Access -> Integrations -> Keys). Name it
#      `nabeeh_asc` below.
#   3. Code signing identities: let Codemagic create the distribution
#      certificate and App Store profile for bundle id com.rateby.rateby.
workflows:
  ios-release:
    name: Nabeeh iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: nabeeh_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rateby.rateby
      vars:
        APP_STORE_APPLE_ID: "0000000000" # numeric Apple ID of the app in App Store Connect
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          flutter build ipa --release \
            --build-name=1.0.0 --build-number=$BUILD_NUMBER \
            --dart-define-from-file=config/release.ios.defines.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
