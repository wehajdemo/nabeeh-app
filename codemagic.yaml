# Builds the iPhone app in the cloud (no Mac needed) and sends it to TestFlight.
# Step-by-step setup (Arabic): docs/APP_STORE_SETUP.md. In short:
#   1. Codemagic (codemagic.io): add this GitHub repository.
#   2. App Store Connect API key: uses the account's existing Codemagic
#      integration `MUSAID` (same Apple team). The key stays in Codemagic,
#      never in this repository.
#   3. Code signing identities: let Codemagic create the distribution
#      certificate and App Store profile for bundle id com.rateby.rateby
#      (the App ID needs the "Sign in with Apple" capability first).
# A build starts by itself when a tag named ios-* is pushed
# (for example ios-1.0.0-1), or by hand from the Codemagic dashboard.
workflows:
  ios-release:
    name: Nabeeh iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MUSAID
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rateby.rateby
      vars:
        # Numeric Apple ID of the app (App Store Connect -> App Information).
        # Optional: only used to continue TestFlight build numbers.
        APP_STORE_APPLE_ID: "6831252529"
        # Optional: add GOOGLE_IOS_CLIENT_ID (OAuth client id of the iOS app)
        # here to offer Google sign-in on the iPhone next to Sign in with
        # Apple. Not set = Apple only. (Codemagic rejects empty values.)
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Google sign-in URL scheme (only when a client id is set)
        script: |
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
            REVERSED=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s",$i,(i>1?".":"")}')
            PLIST=ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$PLIST"
          fi
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LATEST=0
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$BUILD_NUMBER
          if [ "$LATEST" -ge "$NEXT" ]; then NEXT=$((LATEST + 1)); fi
          GOOGLE_DEFINE=""
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
            GOOGLE_DEFINE="--dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID"
          fi
          flutter build ipa --release \
            --build-name=1.0.0 --build-number=$NEXT \
            --dart-define-from-file=config/release.ios.defines.json $GOOGLE_DEFINE \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
